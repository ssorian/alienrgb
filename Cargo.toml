[package]
name = "alienrgb"
version = "0.1.0"
edition = "2021"
description = "Guarded Alienware m16 R2 RGB diagnostics and experimental static-color transport"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
rusb = { version = "0.9", default-features = false }
rustix = { version = "1.0", features = ["fs"] }
